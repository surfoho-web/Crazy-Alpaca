<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#05060a">
  <meta name="description" content="Crazy Alpaca">
  <title>CRAZY ALPACA</title>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;overflow:hidden}
    body{
      background:#05060a;
      color:#fff;
      font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      display:grid;place-items:center;
    }
    body:before{
      content:"";position:fixed;inset:-30%;
      background:
        radial-gradient(circle at 50% 45%,rgba(111,0,255,.22),transparent 24%),
        radial-gradient(circle at 20% 80%,rgba(0,238,255,.12),transparent 25%),
        radial-gradient(circle at 80% 15%,rgba(255,0,153,.10),transparent 25%);
      filter:blur(35px);animation:drift 9s ease-in-out infinite alternate;
    }
    .grid{
      position:fixed;inset:0;opacity:.16;
      background-image:linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px),
                       linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px);
      background-size:42px 42px;
      mask-image:linear-gradient(to bottom,transparent,black 20%,black 80%,transparent);
    }
    .wrap{position:relative;z-index:2;text-align:center;padding:24px}
    .orb{
      width:108px;height:108px;margin:0 auto 28px;border-radius:50%;
      background:radial-gradient(circle at 35% 30%,#fff 0 3%,#d5b8ff 4%,#7d35ff 23%,#28006d 55%,#08000e 72%);
      box-shadow:0 0 28px #8b42ff,0 0 90px rgba(126,52,255,.42),inset 0 0 25px #fff5;
      animation:pulse 2.8s ease-in-out infinite;
    }
    .eyebrow{font-size:11px;letter-spacing:.42em;text-transform:uppercase;color:#9ca3af;margin-bottom:13px}
    h1{margin:0;font-size:clamp(38px,10vw,78px);letter-spacing:-.07em;line-height:.9;font-weight:900}
    h1 span{
      background:linear-gradient(100deg,#fff 10%,#b982ff 48%,#00eaff 90%);
      -webkit-background-clip:text;background-clip:text;color:transparent;
    }
    .sub{margin:17px 0 30px;color:#8b93a7;font-size:13px;letter-spacing:.12em;text-transform:uppercase}
    .download{
      display:inline-flex;align-items:center;gap:12px;
      min-width:215px;justify-content:center;
      padding:16px 24px;border-radius:999px;
      color:#05060a;background:#fff;text-decoration:none;font-weight:800;
      letter-spacing:.04em;
      box-shadow:0 0 0 1px #ffffff22,0 0 35px rgba(145,70,255,.32);
      transition:.25s transform,.25s box-shadow;
    }
    .download:hover{transform:translateY(-3px) scale(1.02);box-shadow:0 0 0 1px #ffffff55,0 0 55px rgba(0,234,255,.38)}
    .download svg{width:18px;height:18px}
    .meta{margin-top:15px;font-size:10px;color:#555d70;letter-spacing:.16em;text-transform:uppercase}
    @keyframes pulse{50%{transform:scale(1.06);box-shadow:0 0 38px #8b42ff,0 0 120px rgba(126,52,255,.52),inset 0 0 25px #fff5}}
    @keyframes drift{to{transform:translate3d(3%, -2%,0) scale(1.05)}}
    @media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
  </style>
</head>
<body>
  <div class="grid"></div>
  <main class="wrap">
    <div class="orb" aria-hidden="true"></div>
    <div class="eyebrow">Experimental • Android</div>
    <h1>CRAZY <span>ALPACA</span></h1>
    <div class="sub">Prank mode activated.</div>
    <a class="download" href="https://github.com/surfoho-web/Crazy-Alpaca/releases/download/Google/crazy-alpaca.apk">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M12 3v12m0 0 5-5m-5 5-5-5M4 21h16"/>
      </svg>
      DOWNLOAD APK
    </a>
    <div class="meta">Android APK • Direct download</div>
  </main>
</body>
</html>
